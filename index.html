<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SautiSahihi — Civic Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        font-size: 18px; /* Large default for seniors */
        -webkit-tap-highlight-color: transparent;
        transition: font-size 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      }
      .large-text {
        font-size: 22px !important;
      }
      .large-text h1 { font-size: 4rem !important; }
      .large-text h2 { font-size: 3.5rem !important; }
      .large-text h3 { font-size: 3rem !important; }
      .large-text p { font-size: 1.8rem !important; line-height: 1.4 !important; }
      .large-text .text-xs, 
      .large-text .text-[10px], 
      .large-text .text-[9px], 
      .large-text .text-[8px] { 
        font-size: 1.2rem !important; 
        letter-spacing: 0.05em !important;
      }
      .large-text .text-sm { font-size: 1.3rem !important; }
      .large-text .text-lg { font-size: 2rem !important; }
      .large-text .text-xl { font-size: 2.2rem !important; }
      .large-text .text-2xl { font-size: 2.5rem !important; }
      .large-text .text-3xl { font-size: 3rem !important; }
      .large-text .text-4xl { font-size: 3.5rem !important; }
      .large-text .text-5xl { font-size: 4rem !important; }
      .large-text .material-symbols-outlined { font-size: 1.5em !important; }

      .high-contrast {
        background-color: #000 !important;
        color: #fff !important;
      }
      .high-contrast * {
        border-color: #fff !important;
        outline-color: #fff !important;
      }
      .high-contrast .bg-white, 
      .high-contrast .bg-gray-50, 
      .high-contrast .bg-slate-50,
      .high-contrast .bg-blue-50,
      .high-contrast .bg-emerald-50,
      .high-contrast .bg-amber-50,
      .high-contrast .bg-red-50,
      .high-contrast .bg-slate-100,
      .high-contrast .bg-gray-100 {
        background-color: #000 !important;
        border: 2px solid #fff !important;
      }
      .high-contrast .text-gray-900,
      .high-contrast .text-slate-900,
      .high-contrast .text-gray-700,
      .high-contrast .text-gray-500,
      .high-contrast .text-slate-500,
      .high-contrast .text-slate-400,
      .high-contrast .text-gray-400 {
        color: #fff !important;
        opacity: 1 !important;
      }
      .high-contrast .text-[#135bec],
      .high-contrast .text-blue-600,
      .high-contrast .text-emerald-600,
      .high-contrast .text-amber-600,
      .high-contrast .text-rose-600,
      .high-contrast .text-red-600 {
        color: #ffff00 !important; /* Bright yellow for visibility on black */
        text-decoration: underline !important;
        font-weight: 900 !important;
      }
      .high-contrast .bg-[#135bec],
      .high-contrast .bg-emerald-600,
      .high-contrast .bg-amber-500,
      .high-contrast .bg-rose-600,
      .high-contrast .bg-red-600,
      .high-contrast .bg-slate-900 {
        background-color: #fff !important;
        color: #000 !important;
        border: 3px solid #000 !important;
      }
      .high-contrast .bg-[#135bec] *,
      .high-contrast .bg-emerald-600 *,
      .high-contrast .bg-amber-500 *,
      .high-contrast .bg-rose-600 *,
      .high-contrast .bg-red-600 *,
      .high-contrast .bg-slate-900 * {
        color: #000 !important;
      }
      .high-contrast button {
        border: 3px solid #fff !important;
      }
      .high-contrast input, .high-contrast textarea, .high-contrast select {
        background-color: #000 !important;
        color: #fff !important;
        border: 3px solid #fff !important;
      }
      .high-contrast .shadow-xl, .high-contrast .shadow-2xl, .high-contrast .shadow-lg {
        box-shadow: none !important;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: 'FILL' 1;
      }
      /* Custom scrollbar for better visibility */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #135bec;
        border-radius: 4px;
      }
      /* The Shimmer Animation for AI Image Generation */
      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }
      .shimmer-bg {
        background: #f6f7f8;
        background-image: linear-gradient(to right, #f6f7f8 0%, #edeef1 20%, #f6f7f8 40%, #f6f7f8 100%);
        background-repeat: no-repeat;
        background-size: 1000px 100%;
        animation: shimmer 2s linear infinite;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 text-gray-900 overflow-hidden dark:bg-gray-900 dark:text-white">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
